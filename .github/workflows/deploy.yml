name: Deploy production
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
permissions: { contents: read }
jobs:
  verify-production:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Wait for Render API and verify health
        run: >-
          curl --fail --silent --show-error
          --retry 20 --retry-delay 15 --retry-all-errors
          --max-time 90
          https://limpiaconecta.onrender.com/api/health
      - name: Wait for Vercel frontend and verify content
        run: >-
          curl --fail --silent --show-error
          --retry 20 --retry-delay 15 --retry-all-errors
          --max-time 60
          https://l-impia-conecta.vercel.app/
          | grep -q '<title>LimpiaConecta</title>'
