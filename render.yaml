services:
  - type: web
    name: limpiaconecta-api
    runtime: node
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DATABASE_URL
        fromDatabase: { name: limpiaconecta-db, property: connectionString }
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
databases:
  - name: limpiaconecta-db
    databaseName: limpiaconecta
    user: limpiaconecta
